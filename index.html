<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/chess-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="棋乐园" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="棋乐园 - 面向6-12岁少儿的国际象棋与中国象棋教学APP" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>棋乐园 - 少儿棋类学堂</title>
    <!-- CDN 预连接：加速 three/peerjs 等运行时依赖的首包 -->
    <link rel="preconnect" href="https://registry.npmmirror.com" crossorigin />
    <link rel="preconnect" href="https://esm.sh" crossorigin />
    <style>
      /* 首屏品牌骨架：JS 加载期间显示，避免白屏/闪烁
         注意：pointer-events:none——即使异常残留也不会拦截页面按钮点击 */
      #app-boot {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: linear-gradient(180deg, #fbf3e4 0%, #f4e8d2 100%);
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        pointer-events: none;
      }
      #app-boot.hide { opacity: 0; transition: opacity .3s; }
      #app-boot .boot-logo {
        width: 74px; height: 74px; border-radius: 22px;
        display: flex; align-items: center; justify-content: center;
        font-size: 40px; color: #fff;
        background: linear-gradient(135deg, #c9a86a, #a5813f);
        box-shadow: 0 8px 24px rgba(150, 110, 40, 0.35);
        animation: boot-bounce 1.2s ease-in-out infinite;
      }
      #app-boot .boot-title { font-size: 20px; font-weight: 700; color: #6b5636; letter-spacing: 4px; }
      #app-boot .boot-sub { font-size: 12px; color: #a08a62; letter-spacing: 2px; }
      #app-boot .boot-bar {
        width: 120px; height: 4px; border-radius: 99px; overflow: hidden;
        background: rgba(160, 130, 80, 0.2); margin-top: 4px;
      }
      #app-boot .boot-bar::after {
        content: ''; display: block; width: 40%; height: 100%; border-radius: 99px;
        background: linear-gradient(90deg, #c9a86a, #e0c07a);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes boot-slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
    </style>
    <!-- CDN importmap 加载，避免本地安装依赖 -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://registry.npmmirror.com/three/0.160.0/files/build/three.module.js",
        "peerjs": "https://esm.sh/peerjs@1.5.4"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"><div id="app-boot"><div class="boot-logo">♟</div><div class="boot-title">棋乐园</div><div class="boot-sub">少儿棋类学堂</div><div class="boot-bar"></div></div></div>
    <script>
      // 兜底：8 秒后无论 JS 是否加载成功都淡出骨架，防止异常情况下骨架残留遮挡页面
      (function () {
        var boot = document.getElementById('app-boot');
        if (!boot) return;
        setTimeout(function () {
          boot.classList.add('hide');
          setTimeout(function () { boot.remove(); }, 400);
        }, 8000);
        // 一旦 DOM 已被 React 接管（root 有内容且非骨架自身），立即移除骨架
        var ob = new MutationObserver(function () {
          var root = document.getElementById('root');
          if (root && root.childNodes.length > 0 && !document.getElementById('app-boot')) { return; }
          if (root && root.children.length > 0 && root.children[0].id !== 'app-boot') {
            boot.classList.add('hide');
            setTimeout(function () { boot.remove(); }, 300);
            ob.disconnect();
          }
        });
        ob.observe(document.getElementById('root') || document.body, { childList: true, subtree: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
